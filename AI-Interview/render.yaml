services:
  - type: web
    name: cda-ai-interview-engine
    env: docker
    region: singapore
    plan: starter          # $7/mo — Always-on, zero cold starts
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false           # Set manually in Render dashboard (never commit key)
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile   # Smarter model, ~350ms via Groq LPU
      - key: PYTHONIOENCODING
        value: utf-8
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8000
